; PlatformIO Project Configuration File — Tonewheel Organ Keyboard Controller
;
; Single target: bare Raspberry Pi Pico (RP2040), Earle Philhower Arduino core.
; Unlike picoST3215 this project has one fixed custom PCB, so there is only
; one environment (no board variants).
;
[platformio]
default_envs = pico

[env:pico]
platform                    = https://github.com/maxgerhardt/platform-raspberrypi.git
board                       = pico
board_build.core            = earlephilhower
board_build.f_cpu           = 120000000L
framework                   = arduino
board_build.filesystem_size = 256k
monitor_speed               = 115200
lib_ldf_mode                = deep+
upload_protocol              = picotool

; CFG_TUD_CDC=1 adds a USB CDC serial port alongside the USB MIDI interface —
; same combined-CDC+MIDI TinyUSB init pattern reused from picoST3215.
; Connect via "pio device monitor" or any serial terminal at 115200.
build_flags =
    -D USE_TINYUSB
    -D CFG_TUD_CDC=1
    -D PICO_STDIO_UART=0
    -D DISPLAY_SSD1306

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306   @ ^2.5.9
    adafruit/Adafruit TinyUSB Library @ ^3.1.0
    fortyseveneffects/MIDI Library @ ^5.0.2

; Actual hardware: 128x32 SSD1306 (same panel as picoControl). If you ever
; swap in an SH1107 panel instead, switch "-D DISPLAY_SSD1306" for
; "-D DISPLAY_SH1107", swap the lib_deps line above for
; "adafruit/Adafruit SH110X @ ^2.1.10", and see config.h's HW::OLED_*
; constants (mirrors picoST3215's DISPLAY_SH1107 / DISPLAY_SSD1306 switch).